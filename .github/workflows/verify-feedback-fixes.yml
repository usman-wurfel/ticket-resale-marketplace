name: Verify Feedback Fixes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Upload verifier
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "scripts/verify-feedback-fixes.php,scripts/verify-feedback-fixes-deep.php"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Run verifier on live
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            PHP_BIN=php8.2
            command -v php8.2 >/dev/null || PHP_BIN=php
            $PHP_BIN scripts/verify-feedback-fixes.php
            $PHP_BIN scripts/verify-feedback-fixes-deep.php
