name: Sync Live Branding

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync logo, color, assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload branding assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public/assets/admin/img/footer_logo,public/assets/admin/img/69e89f55c63f4.png,public/assets/admin/img/69e9eabd8f952.png,public/assets/admin/img/69e89f68eedae.png,scripts/sync-live-branding.php"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          strip_components: 0

      - name: Apply local branding on live DB
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            cd "$APP_DIR"
            PHP_BIN=php8.2
            command -v php8.2 >/dev/null || PHP_BIN=php

            $PHP_BIN scripts/sync-live-branding.php

            $PHP_BIN artisan config:clear || true
            $PHP_BIN artisan view:clear || true
            $PHP_BIN artisan cache:clear || true
            $PHP_BIN artisan config:cache || true

            ls -la public/assets/admin/img/footer_logo/1776854970.png
            echo DONE
