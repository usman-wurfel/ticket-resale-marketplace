name: Fix Missing Assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Upload gallery + ads folders
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public/assets/admin/img/event-gallery,public/assets/admin/img/event/thumbnail,public/assets/front/images,scripts/fix-missing-assets.php"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          strip_components: 0

      - name: Repair missing referenced files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            PHP_BIN=php8.2
            command -v php8.2 >/dev/null || PHP_BIN=php
            $PHP_BIN scripts/fix-missing-assets.php
            # prove gallery is now a real jpeg
            file public/assets/admin/img/event-gallery/690ed26ccc711.jpg || true
            ls -la public/assets/admin/img/event-gallery/690ed26*.jpg public/assets/admin/img/advertisements/64577dea0f0ec.png || true
            $PHP_BIN artisan view:clear || true
            $PHP_BIN artisan cache:clear || true
            echo DONE
